<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="center">

        <h1>Login</h1>

        <form id="formLogin">

            <div class="txt_field">
                <input type="email" id="email" required>
                <label>E-mail</label>
            </div>

            <div class="txt_field">
                <input type="password" id="senha" required>
                <label>Senha</label>
            </div>

            <div class="esqueceu">
                <a href="#">Esqueceu sua senha?</a>
            </div>

            <div class="botoes">

                <input
                    type="submit"
                    value="Conectar"
                    class="btn-conectar"
                >

                <input
                    type="button"
                    value="Cancelar"
                    class="btn-cancelar"
                    onclick="cancelar()"
                >

            </div>

            <div class="signup_link">

                Não é membro?

                <a href="cadastro.html">
                    Cadastre-se
                </a>

            </div>

        </form>

    </div>

    <script src="login.js"></script>

</body>

</html>
