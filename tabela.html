<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Usuários</title>
    <style>
        body {
            font-family: Georgia, serif;
            background: #f4f4f4;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f06acb;
            color: white;
        }
        .voltar {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .voltar:hover {
            background-color: #1f6692;
        }
    </style>
</head>
<body>

    <h1>Usuários Cadastrados no Banco de Dados</h1>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>E-mail</th>
                <th>Senha</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            <!-- Os usuários aparecerão aqui dinamicamente -->
        </tbody>
    </table>

    <a href="login.html" class="voltar">Ir para o Login</a>

    <script src="tabela.js"></script>
</body>
</html>
